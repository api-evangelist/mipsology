name: Mipsology
description: 'Mipsology was a France-based (Palaiseau) AI/ML company founded in 2015 that developed
  Zebra, a deep-learning inference acceleration software stack for FPGA and adaptive-compute hardware.
  Zebra let CPU/GPU-trained neural networks run on FPGAs without changing the model, framework, or
  quantization, targeting high-throughput, low-latency computer-vision inference in the data center
  and at the edge. Mipsology was backed by Partech and other investors and was acquired by AMD in 2023,
  where its team and technology were folded into AMD''s adaptive-computing (Xilinx) AI inference
  software. As an independent company Mipsology exposed no public developer API, SDK client library, or
  developer portal; mipsology.com now 301-redirects to amd.com. This profile is retained as a historical
  network entry with no active API surface.'
